[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# SPA fallback: Netlify serves existing static files directly and only rewrites
# unmatched client-side routes to index.html, so refreshing a nested route
# never produces a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/**"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
