[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# SPA fallback: Netlify serves existing static files directly and only rewrites
# unmatched client-side routes to index.html, so refreshing a nested route
# never produces a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/**"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Immutable, long-lived caching for the hashed/versioned mirror assets.
# These filenames change when their contents change, so a 1-year cache is safe
# and makes repeat visits dramatically faster.
[[headers]]
  for = "/cbol-hp-static-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short-lived cache for the tracker blocker: it is loaded synchronously before
# every other script, so keep it out of the network path without pinning a
# stale copy in browsers for a year.
[[headers]]
  for = "/tracker-block.js"
  [headers.values]
    Cache-Control = "public, max-age=600"
