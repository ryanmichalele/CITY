[build]
  publish = "public"

# SPA fallback: only extension-less (client-side) routes fall back to index.html.
# Real files (CSS/JS/images/fonts) are served directly by Netlify, and a missing
# asset correctly returns a real 404 instead of being rewritten to index.html.
[[redirects]]
  from = "/:path((?!.*\\.).*)"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/**"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
